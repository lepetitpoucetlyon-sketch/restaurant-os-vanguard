<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Nebula - Tactical Command</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #050505;
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
        }

        #canvas-container {
            width: 100vw; height: 100vh;
            position: absolute; top: 0; left: 0;
        }

        svg { width: 100%; height: 100%; }

        .node-circle { stroke-width: 2px; cursor: pointer; transition: all 0.5s ease; }
        .node-circle:hover { filter: brightness(1.5); }
        .link { fill: none; stroke-opacity: 0.2; stroke-width: 1px; transition: all 0.5s ease; }
        .node-text { font-size: 10px; font-weight: 400; text-transform: uppercase; letter-spacing: 0.1em; pointer-events: none; opacity: 0.7; fill: white; }
        .central-node { font-weight: 900; font-size: 14px; letter-spacing: 0.2em; fill: white; opacity: 1 !important; }
        
        .suture-line.active {
            stroke-width: 2px;
            stroke-opacity: 1;
            stroke-dasharray: 6;
            animation: flow 2s linear infinite;
        }

        @keyframes flow { from { stroke-dashoffset: 24; } to { stroke-dashoffset: 0; } }

        .overlay { position: absolute; top: 40px; left: 40px; pointer-events: none; z-index: 10; }
        .title { font-weight: 900; font-size: 2rem; letter-spacing: -0.05em; font-style: italic; margin: 0; }
        .subtitle { color: #C5A059; font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase; margin-top: 5px; }

        .tooltip {
            position: absolute; background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(10px); border: 1px solid rgba(197, 160, 89, 0.3);
            border-radius: 12px; padding: 15px; color: white; font-size: 11px;
            z-index: 200; display: none; width: 220px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: opacity 0.2s ease;
        }
        .tooltip:hover { display: none !important; }
        .tooltip-title { font-weight: 900; color: #C5A059; text-transform: uppercase; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        .tooltip-action { margin-top: 5px; display: flex; align-items: center; gap: 8px; opacity: 0.8; }

        .menu-btn {
            position: absolute; top: 40px; right: 40px; width: 50px; height: 50px;
            background: rgba(255,255,255,0.05); border-radius: 12px;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 6px;
            cursor: pointer; z-index: 100; transition: all 0.3s; border: 1px solid rgba(255,255,255,0.1);
        }
        .menu-btn span { width: 24px; height: 2px; background: white; border-radius: 2px; }

        .sidebar {
            position: fixed; top: 0; right: -400px; width: 400px; height: 100vh;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(20px);
            z-index: 90; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 100px 40px 40px; box-sizing: border-box;
            border-left: 1px solid rgba(255,255,255,0.05); overflow-y: auto;
        }
        .sidebar.active { right: 0; }

        .action-accordion { margin-bottom: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; overflow: hidden; }
        .action-header { padding: 12px 15px; cursor: pointer; font-weight: 700; font-size: 12px; display: flex; justify-content: space-between; align-items: center; }
        .action-content { padding: 0 15px; max-height: 0; overflow: hidden; transition: all 0.4s ease; font-size: 11px; color: #94A3B8; }
        .action-accordion.open .action-content { padding: 15px; max-height: 200px; border-top: 1px solid rgba(255,255,255,0.05); }
        .impact-tag { display: inline-block; background: rgba(197, 160, 89, 0.1); padding: 2px 6px; border-radius: 4px; margin-top: 5px; color: #C5A059; font-weight: 700; }
    </style>
</head>
<body>

    <div class="tooltip" id="tooltip"></div>

    <div class="overlay">
        <div class="title">NEXUS NEBULA</div>
        <div class="subtitle">Souveraineté Grade X - Vision Métier</div>
    </div>

    <div class="menu-btn" onclick="toggleSidebar()">
        <span></span><span></span><span></span>
    </div>

    <div class="sidebar" id="sidebar">
        <div id="category-container"></div>
    </div>

    <div id="canvas-container">
        <svg id="nebula-svg">
            <defs>
                <filter id="glow">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
                <marker id="arrowhead" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#C5A059" />
                </marker>
            </defs>
            <g id="main-group">
                <g id="links-group"></g>
                <g id="nodes-group"></g>
            </g>
        </svg>
    </div>

    <script>
        const pillarColors = {
            CORE: '#6366F1', COMMERCE: '#06B6D4', FINANCE: '#10B981', CUISINE: '#F59E0B',
            LOGISTICS: '#EF4444', HR: '#EC4899', SALLE: '#64748B', INTELLIGENCE: '#8B5CF6', INFRA: '#94A3B8'
        };

        const data = {
            CORE: { label: 'RESTAURANT OS (CORE)', modules: [] },
            INTELLIGENCE: { label: 'Intelligence', color: pillarColors.INTELLIGENCE, modules: ['Tableau de Bord', 'Intelligence Exécutive', 'Analytique BI', 'Google Analytics', 'Référencement IA'] },
            COMMERCE: { label: 'Commerce', color: pillarColors.COMMERCE, modules: ['CRM Clients', 'Réservations Omnicanal', 'Devis', 'Groupes & Privatisation', 'Marketing & Social', 'SEO & Référencement'] },
            SALLE: { label: 'Salle & Service', color: pillarColors.SALLE, modules: ['Point de Vente', 'Plan de Salle', 'Réservations', 'Gestion PMS (Notebook)'] },
            CUISINE: { label: 'Cuisine & Ops', color: pillarColors.CUISINE, modules: ['Production (KDS)', 'Gestion Cuisine', 'Bar & Sommellerie', 'HACCP & Qualité'] },
            LOGISTICS: { label: 'Logistique', color: pillarColors.LOGISTICS, modules: ['Plan des Stockages', 'Stocks & Inventaire', 'Contrôle Réception'] },
            HR: { label: 'Ressources Humaines', color: pillarColors.HR, modules: ['Prise de Poste', 'Ressources Humaines', 'Planning', 'Congés & Absences', 'Recrutement'] },
            FINANCE: { label: 'Finance & Admin', color: pillarColors.FINANCE, modules: ['Trésorerie & Prévisions', 'Gestion Comptable', 'Registres Obligatoires'] },
            INFRA: { label: 'Infrastructure', color: pillarColors.INFRA, modules: ['Cartographie 3D', 'Rechercher', 'Paramètres', 'Gestion des Accès'] }
        };

        const actionsRegistry = [
            { id: 'ACT_RES_INV', origin: 'SALLE_2', label: 'Sync Expected Covers', definition: 'Impact des réservations sur les stocks.', impacts: ['LOGISTICS_1'] },
            { id: 'ACT_POS_LEDGER', origin: 'SALLE_0', label: 'NF525 Fiscal Signature', definition: 'Signature fiscale multi-domaine.', impacts: ['FINANCE_1', 'INTELLIGENCE_2'] },
            { id: 'ACT_HACCP_INV', origin: 'CUISINE_3', label: 'Inventory Quarantine', definition: 'Mise en quarantaine sanitaire.', impacts: ['LOGISTICS_1'] },
            { id: 'ACT_POS_CRM', origin: 'SALLE_0', label: 'Loyalty Points Update', definition: 'Mise à jour fidélité client.', impacts: ['COMMERCE_0'] },
            { id: 'ACT_PAYROLL_ACC', origin: 'HR_1', label: 'Payroll Accounting Sync', definition: 'Synchronisation Compta et Registres.', impacts: ['FINANCE_1', 'FINANCE_2'] },
            { id: 'ACT_HACCP_FISCAL', origin: 'CUISINE_3', label: 'HACCP Fiscal Audit', definition: 'Audit multi-domaine pertes/fiscalité.', impacts: ['FINANCE_1', 'LOGISTICS_1'] },
            { id: 'ACT_KDS_STOCK', origin: 'CUISINE_0', label: 'KDS Stock Consumption', definition: 'Déduction ingrédients en cuisine.', impacts: ['LOGISTICS_1'] }
        ];

        let nodes = []; let links = []; let activeSutures = [];
        let scale = 0.8; let translateX = window.innerWidth / 2; let translateY = window.innerHeight / 2;
        let isDragging = false; let startX, startY;

        const mainGroup = document.getElementById('main-group');
        const linksGroup = document.getElementById('links-group');
        const nodesGroup = document.getElementById('nodes-group');
        const tooltip = document.getElementById('tooltip');

        function generateTopology() {
            nodes = [{ id: 'CORE', label: 'RESTAURANT OS (CORE)', x: 0, y: 0, color: '#fff', type: 'central' }];
            const pillarIds = Object.keys(data).filter(id => id !== 'CORE');
            const R_PILLAR = 300;
            pillarIds.forEach((pId, i) => {
                const angle = (i / pillarIds.length) * Math.PI * 2;
                const px = Math.cos(angle) * R_PILLAR; const py = Math.sin(angle) * R_PILLAR;
                nodes.push({ id: pId, label: data[pId].label, x: px, y: py, color: data[pId].color, type: 'pillar' });
                links.push({ source: 'CORE', target: pId });
                data[pId].modules.forEach((mLabel, j) => {
                    const mId = `${pId}_${j}`;
                    const level = (j % 2 === 0) ? 140 : 220;
                    const subAngle = angle + (j - (data[pId].modules.length - 1) / 2) * (0.8 / data[pId].modules.length);
                    
                    // --- PHYSICAL CONNECTION AUDIT ---
                    const statusRegistry = {
                        "INTELLIGENCE_0": { connected: true, active: true },
                        "INTELLIGENCE_1": { connected: true, active: false },
                        "INTELLIGENCE_2": { connected: true, active: false },
                        "INTELLIGENCE_3": { connected: true, active: false },
                        "INTELLIGENCE_4": { connected: true, active: false },
                        "COMMERCE_0": { connected: true, active: true },
                        "COMMERCE_1": { connected: true, active: true },
                        "COMMERCE_2": { connected: true, active: true },
                        "COMMERCE_3": { connected: true, active: true },
                        "COMMERCE_4": { connected: true, active: true },
                        "COMMERCE_5": { connected: true, active: true },
                        "SALLE_0": { connected: true, active: true },
                        "SALLE_1": { connected: true, active: true },
                        "SALLE_2": { connected: true, active: true },
                        "SALLE_3": { connected: true, active: true },
                        "CUISINE_0": { connected: true, active: true },
                        "CUISINE_1": { connected: true, active: true },
                        "CUISINE_2": { connected: true, active: true },
                        "CUISINE_3": { connected: false, active: true },
                        "LOGISTICS_0": { connected: true, active: true },
                        "LOGISTICS_1": { connected: true, active: true },
                        "LOGISTICS_2": { connected: true, active: true },
                        "HR_0": { connected: true, active: false },
                        "HR_1": { connected: true, active: false },
                        "HR_2": { connected: true, active: false },
                        "HR_3": { connected: true, active: false },
                        "HR_4": { connected: true, active: false },
                        "FINANCE_0": { connected: false, active: false },
                        "FINANCE_1": { connected: true, active: true },
                        "FINANCE_2": { connected: true, active: true },
                        "INFRA_0": { connected: true, active: true },
                        "INFRA_1": { connected: false, active: false },
                        "INFRA_2": { connected: false, active: false },
                        "INFRA_3": { connected: true, active: true }
                    };
                    const mStatus = statusRegistry[mId] || { connected: false, active: false };
                    const isDisconnected = !mStatus.connected;
                    const isAtlasActive = mStatus.active;
                    
                    nodes.push({ id: mId, label: mLabel, x: Math.cos(subAngle)*(R_PILLAR+level), y: Math.sin(subAngle)*(R_PILLAR+level), color: data[pId].color, type: 'module', status: isAtlasActive ? 'active' : 'dormant', connected: !isDisconnected });
                    links.push({ source: pId, target: mId, type: isDisconnected ? 'broken' : 'solid' });
                });
            });
        }

        function buildSidebar() {
            const container = document.getElementById('category-container');
            container.innerHTML = '<h3 style="margin-bottom:20px; font-size:14px; letter-spacing:2px; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:10px;">EXPLORATEUR DE DOMAINES (34 MODS)</h3>';
            const pillarIcons = { COMMERCE: '💼', FINANCE: '💰', CUISINE: '🍳', LOGISTICS: '📦', HR: '👥', SALLE: '🏢', INTELLIGENCE: '🧠', INFRA: '⚡' };
            const moduleIcons = {
                INTELLIGENCE: ['📊', '✨', '📈', '📊', '🤖'], COMMERCE: ['👤', '🌐', '📄', '📂', '📢', '🔍'],
                SALLE: ['📟', '🗺️', '📅', '📓'], CUISINE: ['🍳', '👨‍🍳', '🍷', '🛡️'],
                LOGISTICS: ['🗺️', '🍱', '📦'], HR: ['🕙', '👥', '⏰', '🏖️', '🤝'],
                FINANCE: ['🏦', '🧾', '📋'], INFRA: ['🗺️', '🔍', '⚙️', '🔑']
            };
            const pillars = Object.keys(data).filter(id => id !== 'CORE');
            pillars.forEach(pId => {
                const pillar = data[pId];
                const pillarDiv = document.createElement('div');
                pillarDiv.style.marginBottom = '25px';
                pillarDiv.innerHTML = `<div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;"><div style="width:24px; height:24px; background:${pillar.color}22; border:1px solid ${pillar.color}; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:12px;">${pillarIcons[pId]}</div><div style="font-weight:900; font-size:12px; letter-spacing:1px; text-transform:uppercase;">${pillar.label}</div></div>`;
                pillar.modules.forEach((mLabel, mIdx) => {
                    const mId = `${pId}_${mIdx}`;
                    const moduleActions = actionsRegistry.filter(a => a.origin === mId);
                    const icon = moduleIcons[pId] ? moduleIcons[pId][mIdx] : '•';
                    const node = nodes.find(n => n.id === mId);
                    const moduleDiv = document.createElement('div');
                    moduleDiv.style.marginLeft = '34px'; moduleDiv.style.marginBottom = '8px'; moduleDiv.style.transition = 'all 0.3s ease';
                    let actionsHtml = moduleActions.map(act => `<div class="action-accordion" id="acc-${act.id}"><div class="action-header" onclick="event.stopPropagation(); toggleAction('${act.id}', '${mId}')"><span>⚡ ${act.label}</span><span style="font-size:8px; opacity:0.5;">ACTION</span></div><div class="action-content"><p style="margin-top:0;">${act.definition}</p><div style="font-weight:700; font-size:9px; color:#C5A059; text-transform:uppercase; margin-top:10px;">Impacts Systémique :</div><div style="display:flex; flex-wrap:wrap; gap:5px; margin-top:5px;">${act.impacts.map(impId => `<span class="impact-tag">${nodes.find(n => n.id === impId)?.label || impId}</span>`).join('')}</div></div></div>`).join('');
                    moduleDiv.innerHTML = `<div class="module-row" style="font-size:11px; color:#94A3B8; display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.03); cursor:default;"><div style="display:flex; align-items:center; gap:8px;"><span style="opacity:1; font-size:12px;">${icon}</span><span style="${node && !node.connected ? 'text-decoration: line-through; opacity:0.5;' : ''}">${mLabel}</span></div>${moduleActions.length > 0 ? `<span style="font-size:9px; background:${pillar.color}33; color:${pillar.color}; padding:1px 5px; border-radius:4px; font-weight:700;">${moduleActions.length} ACT</span>` : ''}</div><div class="actions-list" style="margin-top:5px; display:none;">${actionsHtml}</div>`;
                    moduleDiv.onmouseenter = () => { const list = moduleDiv.querySelector('.actions-list'); if (list && moduleActions.length > 0) { list.style.display = 'block'; moduleDiv.querySelectorAll('.action-accordion').forEach(a => a.classList.add('open')); } };
                    moduleDiv.onmouseleave = () => { const list = moduleDiv.querySelector('.actions-list'); if (list) { const hasActiveAction = activeSutures.some(s => s.source === mId); if (!hasActiveAction) { list.style.display = 'none'; moduleDiv.querySelectorAll('.action-accordion').forEach(a => a.classList.remove('open')); } } };
                    pillarDiv.appendChild(moduleDiv);
                });
                container.appendChild(pillarDiv);
            });
        }

        function toggleAction(actId, originId) {
            const acc = document.getElementById(`acc-${actId}`);
            const isOpen = acc.classList.contains('open');
            document.querySelectorAll('.action-accordion').forEach(a => a.classList.remove('open'));
            if (!isOpen) { acc.classList.add('open'); activeSutures = actionsRegistry.find(a => a.id === actId).impacts.map(id => ({ source: originId, target: id })); }
            else { activeSutures = []; }
            draw();
        }

        function draw() {
            linksGroup.innerHTML = ''; nodesGroup.innerHTML = '';
            links.forEach(l => {
                const s = nodes.find(n => n.id === l.source); const t = nodes.find(n => n.id === l.target);
                if(!s || !t) return;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const dx = t.x - s.x; path.setAttribute("d", `M${s.x},${s.y} C${s.x+dx/2},${s.y} ${s.x+dx/2},${t.y} ${t.x},${t.y}`);
                path.setAttribute("class", "link"); path.setAttribute("stroke", t.color); 
                if (l.type === 'broken') { path.setAttribute("stroke-dasharray", "40, 20, 40"); path.setAttribute("stroke-opacity", "0.3"); }
                linksGroup.appendChild(path);
            });
            activeSutures.forEach(suture => {
                const s = nodes.find(n => n.id === suture.source); const t = nodes.find(n => n.id === suture.target);
                if(!s || !t) return;
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                const dx = t.x - s.x; path.setAttribute("d", `M${s.x},${s.y} C${s.x+dx/2},${s.y} ${s.x+dx/2},${t.y} ${t.x},${t.y}`);
                path.setAttribute("class", "link suture-line active"); path.setAttribute("stroke", "#C5A059"); path.setAttribute("marker-end", "url(#arrowhead)"); linksGroup.appendChild(path);
            });
            const activeNodeIds = activeSutures.length > 0 ? new Set([...activeSutures.map(s => s.source), ...activeSutures.map(s => s.target)]) : null;
            nodes.forEach(n => {
                const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                if (activeNodeIds && !activeNodeIds.has(n.id) && n.type !== 'central') { g.style.opacity = "0.1"; g.style.filter = "blur(1px)"; }
                else { g.style.opacity = "1"; g.style.filter = "none"; }
                let shape;
                if (n.type === 'pillar') { shape = document.createElementNS("http://www.w3.org/2000/svg", "rect"); shape.setAttribute("x", n.x - 8); shape.setAttribute("y", n.y - 8); shape.setAttribute("width", 16); shape.setAttribute("height", 16); shape.setAttribute("rx", 2); }
                else { shape = document.createElementNS("http://www.w3.org/2000/svg", "circle"); shape.setAttribute("cx", n.x); shape.setAttribute("cy", n.y); shape.setAttribute("r", n.type === 'central' ? 12 : 4); }
                shape.setAttribute("class", "node-circle"); shape.setAttribute("fill", n.status === 'active' || n.type === 'central' ? n.color : 'transparent');
                shape.setAttribute("stroke", n.color); shape.setAttribute("filter", "url(#glow)");
                if (n.status === 'dormant' && n.type === 'module') { shape.setAttribute("stroke-dasharray", "3,2"); shape.setAttribute("stroke-opacity", "0.5"); }
                shape.onmouseenter = (e) => { const acts = actionsRegistry.filter(a => a.origin === n.id); if (acts.length) { tooltip.style.display = 'block'; tooltip.style.left = (e.clientX + 15) + 'px'; tooltip.style.top = (e.clientY + 15) + 'px'; tooltip.innerHTML = `<div class="tooltip-title">${n.label}</div>${acts.map(a => `<div class="tooltip-action">⚡ ${a.label}</div>`).join('')}`; } };
                shape.onmouseleave = () => tooltip.style.display = 'none';
                const t = document.createElementNS("http://www.w3.org/2000/svg", "text");
                t.setAttribute("x", n.x + (n.x >= 0 ? 15 : -15)); t.setAttribute("y", n.y + 4);
                t.setAttribute("text-anchor", n.x >= 0 ? "start" : "end"); t.setAttribute("class", "node-text");
                if (n.type === 'central') { t.setAttribute("x", n.x); t.setAttribute("y", n.y + 45); t.setAttribute("text-anchor", "middle"); t.classList.add('central-node'); }
                if (n.status === 'dormant' && n.type === 'module') { t.style.opacity = "0.3"; }
                t.textContent = n.label; g.appendChild(shape); g.appendChild(t); nodesGroup.appendChild(g);
            });
            updateTransform();
        }

        function updateTransform() { mainGroup.setAttribute("transform", `translate(${translateX}, ${translateY}) scale(${scale})`); }
        window.addEventListener('mousedown', (e) => { if (e.target.tagName === 'svg') { isDragging = true; startX = e.clientX - translateX; startY = e.clientY - translateY; } });
        window.addEventListener('mousemove', (e) => { if (isDragging) { translateX = e.clientX - startX; translateY = e.clientY - startY; updateTransform(); } });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('wheel', (e) => { if (e.target.closest('.sidebar')) return; e.preventDefault(); scale *= (e.deltaY > 0 ? 0.9 : 1.1); updateTransform(); }, { passive: false });
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('active'); }

        generateTopology(); buildSidebar(); draw();
    </script>
</body>
</html>
