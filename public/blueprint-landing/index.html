        @keyframes pulse-impact { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .noeud.recherche-match circle { stroke: var(--neon-or); stroke-width: 4px; filter: drop-shadow(0 0 10px var(--neon-or)); }
        
        .lien-adn { fill: none; stroke-opacity: 0.4; stroke-width: 1.5px; transition: all 0.5s; }
        .lien-adn.flou { stroke-opacity: 0.02 !important; }

        .btn-profil i { width: 16px; height: 16px; stroke: currentColor; }
        .btn-profil:not(:hover) i { color: rgba(255,255,255,0.4); }
        
        .marker-color { fill-opacity: 0.6; }
        
        /* PULSES MAGENTA (Incidences Systémiques) */
        .lien-pulsant { fill: none; stroke-width: 2.5px; stroke-dasharray: 10, 15; opacity: 0; pointer-events: none; stroke: var(--neon-violet); filter: drop-shadow(0 0 8px var(--neon-violet)); }
        .flux-omega { opacity: 0.85; animation: pulse-flow 6s linear infinite; }
        @keyframes pulse-flow { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }

        /* EFFET DE LUEUR AU SURVOL */
        .noeud:hover circle { filter: drop-shadow(0 0 15px rgba(255,255,255,0.4)); stroke-width: 3px; }
        .noeud text { transition: all 0.5s var(--transition-luxe); }
        .noeud:hover text { font-size: 14px; fill: #FFF !important; text-shadow: 0 0 10px rgba(255,255,255,0.8); }

                                { nom: "Semantic Search (Vector)", genre: "revenue" },
                                { nom: "Function Calling Engagement", genre: "action" }
                            ]},
                            { nom: "Analyses Prédictives", genre: "revenue", description: "Prédictions d'affluence et de chiffre d'affaires basées sur l'historique." }
                        ]},
                        { nom: "Tutoriel (Context)", genre: "action", chemins: [
                            { nom: "Mode Tutoriel Immersif", genre: "action", description: "Accompagnement IA pour l'apprentissage du logiciel." }
                        ]}
                    ]
                }
            ]
        };


        const width = window.innerWidth, height = window.innerHeight;
        const svg = d3.select("#canvasOmega");
        const g = svg.append("g").attr("transform", d3.zoomIdentity.translate(width*0.1, height/2).scale(0.8));
        const fluxLayer = g.append("g");

        const zoom = d3.zoom().scaleExtent([0.1, 5]).on("zoom", e => g.attr("transform", e.transform));
        svg.call(zoom);

        const treeLayout = d3.tree().nodeSize([50, 400]);
        const rootNode = d3.hierarchy(data, d => d.chemins);
        let nodeCount = 0;

        function refresh(sourceNode) {
            const treeData = treeLayout(rootNode);
            const nodes = treeData.descendants(), links = treeData.links();
            nodes.forEach(d => d.y = d.depth * 400);

            const link = g.selectAll('path.lien-adn').data(links, d => d.target.id || (d.target.id = ++nodeCount));
            link.enter().insert('path', "g").attr("class", "lien-adn").attr('marker-end', 'url(#arrowhead)').merge(link)
                .transition().duration(800)
                .attr('d', d3.linkHorizontal().x(d=>d.y).y(d=>d.x))
                .style("stroke", d => getColor(d.target.data.genre));

            const node = g.selectAll('g.noeud').data(nodes, d => d.id || (d.id = ++nodeCount));
            const nodeEnter = node.enter().append('g').attr('class', 'noeud')
                .attr("transform", d => `translate(${sourceNode.y || 0},${sourceNode.x || 0})`)
                .on('click', (e, d) => { if(d.children){ d._children = d.children; d.children = null; } else { d.children = d._children; d._children = null; } refresh(d); })
                .on('mouseover', (e, d) => {
                    const sources = nodes.filter(n => n.data.contrecoup && n.data.contrecoup.includes(d.data.nom)).map(n => n.data.nom);
                    const impacts = d.data.contrecoup || [];

                    // Highlight systemic impact links (Magenta)
                    if(d.data.contrecoup) {
                        d.data.contrecoup.forEach(t => { 
                            const targetClass = t.replace(/\s+/g,'-').replace(/[()\/]/g, '');
                            d3.selectAll(`.flux-to-${targetClass}`).classed("flux-omega", true); 
                            d3.selectAll("g.noeud").filter(n => n.data.nom === t).classed("cible-impact", true);
                        });
                    }

                    const b = d3.select("#bulleArchitecte").classed("hidden", false);
                    b.style("left", (e.pageX+30)+"px").style("top", (e.pageY-30)+"px");
                    
                    // FIXED: Using direct selection to avoid previous variable scoping issues
                    d3.select("#ba-titre").text(d.data.nom);
                    d3.select("#ba-badge").text(d.data.genre.toUpperCase()).style("color", getColor(d.data.genre)).style("border-color", getColor(d.data.genre));
                    
                    const impactsHTML = `
                        <div class="space-y-4">
                            ${d.data.description ? `<div class="text-white/70 text-[10px] leading-relaxed italic border-b border-white/5 pb-2">"${d.data.description}"</div>` : ''}

                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2">
                                    <h4 class="text-[9px] uppercase tracking-widest text-white/40 font-bold">Origines (Amont)</h4>
                                    <div class="flex flex-wrap gap-1">
                                        ${sources.length > 0 ? sources.map(s => `<span class="px-1.5 py-0.5 bg-white/5 border border-white/10 rounded-sm text-[8px] text-white/40">${s}</span>`).join('') : '<span class="text-[8px] text-white/20 italic">Aucune</span>'}
                                    </div>
                                </div>
                                <div class="space-y-2">
                                    <h4 class="text-[9px] uppercase tracking-widest text-neon-violet font-bold">Incidences (Aval)</h4>
                                    <div class="flex flex-wrap gap-1">
                                        ${impacts.length > 0 ? impacts.map(i => `<span class="px-1.5 py-0.5 bg-neon-violet/10 border border-neon-violet/30 rounded-sm text-[8px] text-neon-violet font-bold">${i}</span>`).join('') : '<span class="text-[8px] text-white/20 italic">Aucune</span>'}
                                    </div>
                                </div>
                            </div>

                            ${d.data.impactsDetail ? `
                                <div class="space-y-2 pt-2 border-t border-white/10">
                                    <h4 class="text-[9px] uppercase tracking-widest text-neon-or font-bold">Conséquences v20.0</h4>
                                    <ul class="text-[9px] space-y-1">
                                        ${d.data.impactsDetail.map(i => `<li class="flex items-start gap-2"><span class="text-neon-or mt-1">◆</span><span class="text-white/90 font-light">${i}</span></li>`).join('')}
                                    </ul>
                                </div>
                            ` : ''}

                            ${d.data.chemins ? `
                                <div class="space-y-2 pt-2 border-t border-white/10">
                                    <h4 class="text-[9px] uppercase tracking-widest text-blue-400 font-bold">Sous-processus Atomiques</h4>
                                    <div class="flex flex-wrap gap-1">
                                        ${d.data.chemins.map(c => `<span class="px-1.5 py-0.5 bg-blue-500/10 border border-blue-500/20 rounded-sm text-[8px] text-blue-300 font-mono">${c.nom}</span>`).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div class="text-[8px] text-white/10 pt-1 text-right italic font-mono uppercase tracking-tighter">Omniscience Absolue v20.0</div>
                        </div>
                    `;
                    
                    d3.select("#ba-impacts").classed("hidden", false).select("#ba-impacts-list").html(impactsHTML);
                })
                .on('mouseout', () => { 
                    d3.select("#bulleArchitecte").classed("hidden", true); 
                    d3.selectAll(".lien-pulsant").classed("flux-omega", false); 
                    d3.selectAll("g.noeud").classed("cible-impact", false);
                });

            nodeEnter.append('circle').attr('r', d => d.depth === 0 ? 14 : 6).style("stroke", d => getColor(d.data.genre)).style("fill", "#000");
            nodeEnter.append('text').attr("dy", ".35em").attr("x", d => d.children || d._children ? -15 : 15).attr("text-anchor", d => d.children || d._children ? "end" : "start").text(d => d.data.nom).style("fill", "#FFF");

            const nodeUpdate = nodeEnter.merge(node);
            nodeUpdate.transition().duration(800).attr("transform", d => `translate(${d.y},${d.x})`);

            fluxLayer.selectAll("*").remove();
            nodes.forEach(d => {
                if(d.data.contrecoup) d.data.contrecoup.forEach(t => {
                    const targetNode = nodes.find(n => n.data.nom.includes(t));
                    if(targetNode) {
                        const targetClass = t.replace(/\s+/g,'-').replace(/[()\/]/g, '');
                        fluxLayer.append("path")
                            .attr("class", `lien-pulsant flux-to-${targetClass}`)
                            .attr("d", d3.linkHorizontal()({ source: [d.y, d.x], target: [targetNode.y, targetNode.x] }))
                            .style("stroke", getColor('repercussion'));
                    }
                });
            });
            node.exit().remove(); link.exit().remove();
        }

        function getColor(g) {
            switch(g) { case 'action': return '#38BDF8'; case 'repercussion': return '#C084FC'; case 'revenue': return '#FACC15'; case 'critique': return '#F87171'; default: return '#FFF'; }
        }

        refresh(rootNode);
        svg.call(zoom.transform, d3.zoomIdentity.translate(width*0.1, height/2).scale(0.8));

        d3.select("#vPlus").on("click", () => svg.transition().duration(500).call(zoom.scaleBy, 1.5));
        d3.select("#vMoins").on("click", () => svg.transition().duration(500).call(zoom.scaleBy, 0.7));
        d3.select("#vHome").on("click", () => svg.transition().duration(800).call(zoom.transform, d3.zoomIdentity.translate(width*0.1, height/2).scale(0.8)));

        const sidePanel = document.getElementById('atlasOmega');
        document.getElementById('boutonAtlas').onclick = () => sidePanel.classList.remove('translate-x-full');
        document.getElementById('fermerAtlas').onclick = () => sidePanel.classList.add('translate-x-full');

        d3.select("#inputRecherche").on("input", function(e) {
            const v = e.target.value.toLowerCase();
            const c = d3.select("#compteurResultats");
            if(v.length < 2) { d3.selectAll(".noeud, .lien-adn").classed("flou", false).classed("recherche-match", false); c.style("opacity",0); return; }
            let mCount = 0;
            d3.selectAll(".noeud").classed("recherche-match", d => { const r = d.data.nom.toLowerCase().includes(v); if(r) mCount++; return r; }).classed("flou", d => !d.data.nom.toLowerCase().includes(v));
            d3.selectAll(".lien-adn").classed("flou", true);
            c.text(mCount).style("opacity", 1);
        });

        const mapping = { manager: ["GOUVERNANCE", "NUCLEUS"], serveur: ["OPÉRATIONS"], chef: ["CUISINE", "LOGISTIQUE", "HACCP"], comptable: ["LOGISTIQUE", "GOUVERNANCE"] };
        d3.selectAll(".btn-profil").on("click", function() {
            const p = d3.select(this).attr("data-profil"), filterList = mapping[p];
            d3.selectAll(".noeud").classed("flou", d => !filterList.some(x => d.data.nom.toUpperCase().includes(x))).classed("focus", d => filterList.some(x => d.data.nom.toUpperCase().includes(x)));
            d3.selectAll(".lien-adn").classed("flou", d => !(filterList.some(x => d.target.data.nom.toUpperCase().includes(x)) && filterList.some(x => d.source.data.nom.toUpperCase().includes(x))));
        });
        d3.select("#resetFocus").on("click", () => d3.selectAll(".noeud, .lien-adn").classed("flou", false).classed("focus", false).classed("recherche-match", false));
        lucide.createIcons();
    </script>
</body>
</html>
