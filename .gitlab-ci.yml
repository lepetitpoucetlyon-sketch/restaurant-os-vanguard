# ══════════════════════════════════════════════════════════════════════════════
# Gates de vérité CÔTÉ SERVEUR — la SEULE barrière qu'un `git commit --no-verify`
# local ne peut pas franchir. S'exécute automatiquement à chaque push / merge request.
# ══════════════════════════════════════════════════════════════════════════════
stages: [verify, build]

default:
  image: node:20
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths: [node_modules/]

gates:
  stage: verify
  script:
    - npm ci
    - echo "🔍 TypeScript (brut)…"      && npx tsc --noEmit
    - echo "🧹 Barrel Contract = 0…"    && test "$(npx eslint src --format stylish --max-warnings 99999 | grep -c 'Barrel Contract')" -eq 0
    - echo "🔒 Intégrité des gates…"     && node scripts/verify-gate-integrity.mjs
    - echo "🔄 Cycles d'import…"         && node scripts/cycles-inspector.mjs --threshold=430
    - echo "🗺️  Carte à jour ?…"         && node scripts/generate-architecture-map.mjs && git diff --exit-code docs/ARCHITECTURE-MAP.md docs/architecture-map.json
    - echo "🧪 Tests…"                    && npx vitest run

prod-build:
  stage: build
  script:
    - npm ci
    - npx next build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
