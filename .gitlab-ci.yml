# ─────────────────────────────────────────────────────────────────
# Restaurant OS — GitLab CI/CD Pipeline
# Stages: lint → type → unit → build → e2e → deploy
# ─────────────────────────────────────────────────────────────────

image: node:22-alpine

variables:
  NEXT_TELEMETRY_DISABLED: "1"
  HUSKY: "0"
  CI: "true"

# Global cache — shared node_modules + Next.js build cache
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .next/cache/

stages:
  - install
  - lint
  - type
  - unit
  - build
  - e2e
  - deploy

# ───── Install ─────
install:
  stage: install
  script:
    - npm ci --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

# ───── Lint ─────
lint:
  stage: lint
  needs: [install]
  script:
    - npx eslint src/ --max-warnings=0 --format=compact
    - npx prettier --check "src/**/*.{ts,tsx,css,json}"
  allow_failure: false

# ───── Type Check ─────
typecheck:
  stage: type
  needs: [install]
  script:
    - npx tsc --noEmit
  allow_failure: false

# ───── Unit Tests ─────
unit:
  stage: unit
  needs: [install]
  script:
    - npx vitest run --reporter=verbose
  coverage: /All files[^|]*\|[^|]*\s+([\d\.]+)/
  artifacts:
    when: always
    reports:
      junit: test-results/junit.xml
    paths:
      - coverage/
    expire_in: 7 days

# ───── Build ─────
build:
  stage: build
  needs: [lint, typecheck, unit]
  script:
    - npm run build
  artifacts:
    paths:
      - .next/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_IID'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ───── E2E Tests (Playwright) ─────
e2e:
  stage: e2e
  needs: [build]
  image: mcr.microsoft.com/playwright:v1.52.0-focal
  script:
    - npm ci --prefer-offline
    - npx playwright install --with-deps chromium
    - npx playwright test --project=chromium --reporter=list
  artifacts:
    when: always
    paths:
      - playwright-report/
      - test-results/
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

# ───── Deploy Staging (auto on main) ─────
deploy_staging:
  stage: deploy
  needs: [build]
  script:
    - npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
    - npx vercel build --token=$VERCEL_TOKEN
    - npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
    - echo "Deployed to staging"
  environment:
    name: staging
    url: https://staging.restaurant-os.fr
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ───── Deploy Production (manual, on tags only) ─────
deploy_production:
  stage: deploy
  needs: [e2e]
  script:
    - npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - npx vercel build --prod --token=$VERCEL_TOKEN
    - npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
    - echo "Deployed to production"
  environment:
    name: production
    url: https://restaurant-os.fr
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
  allow_failure: false

# ───── Smoke Tests Post-Deploy ─────
smoke_prod:
  stage: deploy
  needs: [deploy_production]
  script:
    - npx playwright test tests/smoke/ --project=chromium --reporter=list
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
  allow_failure: false
