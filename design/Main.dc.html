<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; }
    a { color: #C5A059; } a:hover { color: #E0BE7A; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #2A2A33; border-radius: 3px; }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; display: flex; flex-direction: column; background: #0B0B0C; color: #F3F4F6; overflow: hidden;">

  <!-- ── Bandeau de service : tout ce qui compte en un coup d'œil ────────── -->
  <div style="display: flex; align-items: center; gap: 20px; padding: 0 20px; height: 64px; background: #111827; border-bottom: 1px solid #1F2937; flex-shrink: 0;">
    <div style="display: flex; align-items: baseline; gap: 10px; min-width: 0;">
      <span class="serif" style="font-size: 30px; font-weight: 700; font-style: italic; color: #F9FAFB; line-height: 1;">Table {{table.numero}}</span>
      <span style="font-size: 13px; color: #9CA3AF; white-space: nowrap;">{{table.couverts}} couverts</span>
    </div>

    <div style="display: flex; gap: 6px; background: #0B0B0C; padding: 4px; border-radius: 12px;">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="2">
        <button onClick="{{m.choisir}}" style="height: 44px; padding: 0 18px; border-radius: 10px; font-size: 13px; font-weight: 600; background: {{m.fond}}; color: {{m.encre}};">{{m.nom}}</button>
      </sc-for>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; align-items: center; gap: 8px; padding: 0 14px; height: 36px; border-radius: 9px; background: {{service.fond}}; border: 1px solid {{service.bord}};">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: {{service.point}};"></span>
      <span style="font-size: 12px; font-weight: 600; color: {{service.encre}}; letter-spacing: 0.04em;">{{service.libelle}}</span>
    </div>

    <button style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 12px; background: #1F2937; color: #E5E7EB; font-size: 13px; font-weight: 600;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Rechercher
    </button>
  </div>

  <!-- ── Corps : rail catégories · grille produits · addition ────────────── -->
  <div style="display: flex; flex: 1; min-height: 0;">

    <!-- Rail catégories : cibles tactiles de 68px, jamais tronquées -->
    <div style="width: 108px; flex-shrink: 0; background: #111827; border-right: 1px solid #1F2937; padding: 12px 10px; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{categories}}" as="c" hint-placeholder-count="4">
        <button onClick="{{c.choisir}}" style="height: 68px; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; background: {{c.fond}}; border: 1px solid {{c.bord}}; color: {{c.encre}};">
          <span style="font-size: 19px; line-height: 1;">{{c.pictogramme}}</span>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.02em;">{{c.nom}}</span>
        </button>
      </sc-for>
    </div>

    <!-- Grille produits -->
    <div style="flex: 1; min-width: 0; padding: 16px; overflow-y: auto;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
        <span class="serif" style="font-size: 22px; font-weight: 700; font-style: italic; color: #F9FAFB;">{{categorieActive.nom}}</span>
        <span style="font-size: 12px; color: #6B7280;">{{categorieActive.compte}} articles</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
        <sc-for list="{{produits}}" as="p" hint-placeholder-count="6">
          <button onClick="{{p.ajouter}}" style="height: 104px; border-radius: 16px; background: #15161C; border: 1px solid #232530; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; text-align: left;">
            <span style="font-size: 14px; font-weight: 600; color: #F3F4F6; line-height: 1.3;">{{p.nom}}</span>
            <div style="display: flex; align-items: baseline; justify-content: space-between;">
              <span class="mono" style="font-size: 15px; font-weight: 600; color: #C5A059;">{{p.prix}}</span>
              <span style="font-size: 12px; color: {{p.stockEncre}};">{{p.stock}}</span>
            </div>
          </button>
        </sc-for>
      </div>
    </div>

    <!-- Addition : largeur FIXE de 320px, jamais rognée ─────────────────── -->
    <div style="width: 320px; flex-shrink: 0; background: #111827; border-left: 1px solid #1F2937; display: flex; flex-direction: column;">

      <div style="padding: 16px 18px 12px; border-bottom: 1px solid #1F2937;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #C5A059;">ADDITION</div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px;">
          <span class="serif" style="font-size: 20px; font-weight: 700; color: #F9FAFB;">{{panier.compte}}</span>
          <button style="height: 44px; padding: 0 12px; margin-right: -12px; border-radius: 10px; font-size: 12px; color: #9CA3AF;">Vider</button>
        </div>
      </div>

      <div style="flex: 1; overflow-y: auto; padding: 10px 12px;">
        <sc-if value="{{panier.vide}}" hint-placeholder-val="{{false}}">
          <div style="height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 30px 20px; text-align: center;">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#374151" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16l-1.5 11.5a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>
            <span style="font-size: 13px; color: #6B7280; line-height: 1.5;">Touchez un article<br>pour commencer</span>
          </div>
        </sc-if>
        <sc-for list="{{lignes}}" as="l" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: #15161C; margin-bottom: 8px;">
            <span class="mono" style="width: 26px; height: 26px; flex-shrink: 0; border-radius: 8px; background: rgba(197,160,89,0.14); color: #C5A059; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center;">{{l.quantite}}</span>
            <span style="flex: 1; min-width: 0; font-size: 13px; color: #E5E7EB; line-height: 1.3;">{{l.nom}}</span>
            <span class="mono" style="font-size: 13px; font-weight: 600; color: #F3F4F6;">{{l.total}}</span>
            <button onClick="{{l.retirer}}" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: #1F2937; color: #9CA3AF; font-size: 18px; line-height: 1;">−</button>
          </div>
        </sc-for>
      </div>

      <div style="padding: 14px 18px 16px; border-top: 1px solid #1F2937; background: #0F1117;">
        <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B7280; margin-bottom: 5px;">
          <span>Total HT</span><span class="mono">{{panier.ht}}</span>
        </div>
        <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
          <span class="serif" style="font-size: 15px; font-weight: 700; font-style: italic; color: #C5A059;">Total TTC</span>
          <span class="mono" style="font-size: 26px; font-weight: 600; color: #F9FAFB;">{{panier.ttc}}</span>
        </div>

        <!-- Les trois actions tiennent DANS le panneau — c'est le défaut mesuré
             sur l'interface actuelle : à 1024px elles débordaient de 113px. -->
        <button style="width: 100%; height: 44px; border-radius: 14px; background: #1F2937; color: #D1D5DB; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><path d="M16 6.5a3 3 0 0 1 0 5.4"/><path d="M18.5 20a5.6 5.6 0 0 0-2.2-4.4"/></svg>
          Partager l'addition
        </button>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <button style="height: 52px; border-radius: 14px; background: #1F2937; color: #D1D5DB; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M7 21h10"/><path d="M12 21v-4"/><path d="M5 9a7 7 0 0 1 14 0v4a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3Z"/></svg>
            Cuisine
          </button>
          <button style="height: 52px; border-radius: 14px; background: #C5A059; color: #16130B; font-size: 13px; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19"/></svg>
            Encaisser
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{
  "accent": {"editor": "color", "default": "#C5A059", "options": ["#C5A059", "#6366F1", "#059669", "#DC2626"], "section": "Marque"},
  "densite": {"editor": "enum", "options": ["Confort", "Compact"], "default": "Confort", "section": "Salle"}
}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { categorie: 'plats', mode: 'place', panier: {} };
  }

  catalogue() {
    return {
      entrees: { nom: 'Entrées', pictogramme: '🥗', articles: [
        { id: 'e1', nom: 'Velouté de potimarron', prix: 9.5, stock: '' },
        { id: 'e2', nom: 'Œuf parfait, girolles', prix: 14, stock: '' },
        { id: 'e3', nom: 'Tartare de daurade', prix: 16, stock: '3 restants' },
      ]},
      plats: { nom: 'Plats', pictogramme: '🍽️', articles: [
        { id: 'p1', nom: 'Suprême de volaille', prix: 26, stock: '' },
        { id: 'p2', nom: 'Bar de ligne, fenouil', prix: 32, stock: '2 restants' },
        { id: 'p3', nom: 'Côte de bœuf, 2 pers.', prix: 68, stock: '' },
        { id: 'p4', nom: 'Risotto aux cèpes', prix: 24, stock: '' },
        { id: 'p5', nom: 'Agneau de sept heures', prix: 29, stock: '' },
        { id: 'p6', nom: 'Ravioles de ricotta', prix: 22, stock: '' },
      ]},
      desserts: { nom: 'Desserts', pictogramme: '🍰', articles: [
        { id: 'd1', nom: 'Paris-Brest', prix: 11 },
        { id: 'd2', nom: 'Tarte au citron', prix: 10 },
        { id: 'd3', nom: 'Baba au rhum', prix: 12 },
      ]},
      boissons: { nom: 'Cave', pictogramme: '🍷', articles: [
        { id: 'b1', nom: 'Sancerre, verre', prix: 8.5 },
        { id: 'b2', nom: 'Côtes-du-Rhône, btl', prix: 34 },
        { id: 'b3', nom: 'Eau plate 75cl', prix: 5 },
        { id: 'b4', nom: 'Café', prix: 3.5 },
      ]},
    };
  }

  euro(v) { return v.toFixed(2).replace('.', ',') + ' €'; }

  renderVals() {
    const accent = this.props.accent ?? '#C5A059';
    const cat = this.catalogue();
    const actif = this.state.categorie;

    const categories = Object.keys(cat).map((cle) => {
      const on = cle === actif;
      return {
        nom: cat[cle].nom,
        pictogramme: cat[cle].pictogramme,
        fond: on ? 'rgba(197,160,89,0.14)' : 'transparent',
        bord: on ? accent : 'transparent',
        encre: on ? accent : '#9CA3AF',
        choisir: () => this.setState({ categorie: cle }),
      };
    });

    const produits = cat[actif].articles.map((a) => ({
      nom: a.nom,
      prix: this.euro(a.prix),
      stock: a.stock || '',
      stockEncre: a.stock ? '#F59E0B' : '#4B5563',
      ajouter: () => {
        const p = { ...this.state.panier };
        p[a.id] = { nom: a.nom, prix: a.prix, quantite: (p[a.id]?.quantite ?? 0) + 1 };
        this.setState({ panier: p });
      },
    }));

    const lignes = Object.keys(this.state.panier).map((id) => {
      const l = this.state.panier[id];
      return {
        nom: l.nom,
        quantite: l.quantite,
        total: this.euro(l.prix * l.quantite),
        retirer: () => {
          const p = { ...this.state.panier };
          if (p[id].quantite > 1) p[id] = { ...p[id], quantite: p[id].quantite - 1 };
          else delete p[id];
          this.setState({ panier: p });
        },
      };
    });

    const ttc = Object.keys(this.state.panier)
      .reduce((s, id) => s + this.state.panier[id].prix * this.state.panier[id].quantite, 0);
    const nb = Object.keys(this.state.panier)
      .reduce((s, id) => s + this.state.panier[id].quantite, 0);

    const modes = [
      { cle: 'place', nom: 'Sur place' },
      { cle: 'emporter', nom: 'À emporter' },
    ].map((m) => {
      const on = m.cle === this.state.mode;
      return {
        nom: m.nom,
        fond: on ? accent : 'transparent',
        encre: on ? '#16130B' : '#9CA3AF',
        choisir: () => this.setState({ mode: m.cle }),
      };
    });

    return {
      table: { numero: '5', couverts: 2 },
      service: { libelle: 'SERVICE DU SOIR', fond: 'rgba(5,150,105,0.12)', bord: 'rgba(5,150,105,0.3)', point: '#059669', encre: '#34D399' },
      modes,
      categories,
      categorieActive: { nom: cat[actif].nom, compte: cat[actif].articles.length },
      produits,
      lignes,
      panier: {
        vide: nb === 0,
        compte: nb === 0 ? 'Panier vide' : (nb + (nb > 1 ? ' articles' : ' article')),
        ht: this.euro(ttc / 1.1),
        ttc: this.euro(ttc),
      },
    };
  }
}
</script>
</body>
</html>
